name: IntelliPlace CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelliplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json
      
      - name: Install backend dependencies
        run: |
          cd backend
          npm ci
      
      - name: Run Prisma migrations
        run: |
          cd backend
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intelliplace_test?schema=public
      
      - name: Run type checking
        run: |
          cd backend
          npx tsc --noEmit
      
      - name: Run tests with coverage
        run: |
          cd backend
          npm run test:challenges
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intelliplace_test?schema=public
          JWT_SECRET: test-secret-32-chars-minimum-length
          JWT_EXPIRES_IN: 1h
          PORT: 4001
          NODE_ENV: test
          CORS_ORIGIN: http://localhost:5173

  frontend-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      
      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci
      
      - name: Run type checking
        run: |
          cd frontend
          npx tsc --noEmit
      
      - name: Run build
        run: |
          cd frontend
          npm run build
        env:
          VITE_API_URL: http://localhost:4001/api

  e2e-test:
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-test]
    
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: intelliplace_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
      
      - name: Install backend
        run: |
          cd backend
          npm ci
          npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intelliplace_test?schema=public
      
      - name: Install frontend
        run: |
          cd frontend
          npm ci
      
      - name: Install Playwright
        run: npx playwright install --with-deps
      
      - name: Start backend
        run: |
          cd backend
          npm run dev &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/intelliplace_test?schema=public
          JWT_SECRET: test-secret-32-chars-minimum-length
          NODE_ENV: test
          PORT: 4001
      
      - name: Start frontend
        run: |
          cd frontend
          npm run dev &
        env:
          VITE_API_URL: http://localhost:4001/api
      
      - name: Wait for services
        run: |
          sleep 10
          curl -f http://localhost:4001/api/health
          curl -f http://localhost:5173
      
      - name: Run Playwright tests
        run: |
          cd frontend
          npx playwright test

