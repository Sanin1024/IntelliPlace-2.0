services:
  postgres:
    image: postgres:17-alpine
    container_name: intelliplace-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intelliplace
      POSTGRES_PASSWORD: intelliplace_dev_only
      POSTGRES_DB: intelliplace
    ports:
      - "5433:5432"
    volumes:
      - intelliplace-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U intelliplace -d intelliplace"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  intelliplace-postgres-data:
